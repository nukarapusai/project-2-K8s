name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH to EC2 & Deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: <EC2-IP>
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml